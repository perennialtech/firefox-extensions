<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x-account-location-flags settings</title>
  <script src="options.js" defer></script>
</head>
<body>
  <p><label><input type="checkbox" id="highlightUncertain" disabled> Highlight chips in amber when X has not confirmed the location</label></p>
  <p><label><input type="checkbox" id="autoBlockSouthAsia" disabled> Automatically block accounts based in South Asia on X</label></p>
  <p><label><input type="checkbox" id="autoBlockUncertain" disabled> Include accounts reported in South Asia with unconfirmed location or creation-country data, or connecting from South Asia with an unconfirmed location</label></p>
  <p>Automatic blocks are applied to your signed-in X account.</p>
  <p id="status" role="status"></p>
</body>
</html>
