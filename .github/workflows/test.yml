name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Lint Firefox extensions
        run: |
          for extension in extensions/*; do
            mkdir -p addon
            cp "$extension/manifest.json" "$extension/background.js" addon/
            if test -f "$extension/content.js"; then cp "$extension/content.js" addon/; fi
            npx --yes web-ext@10.8.0 lint --self-hosted --source-dir addon
            rm -rf addon
          done
  firefox:
    name: Firefox font regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps firefox
      - if: runner.os == 'Windows'
        run: npx playwright install firefox
      - run: npm run test:firefox
