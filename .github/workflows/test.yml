name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Lint Firefox extensions
        run: |
          for extension in extensions/*; do
            mkdir -p addon
            cp "$extension/manifest.json" "$extension/background.js" addon/
            if test -f "$extension/content.js"; then cp "$extension/content.js" addon/; fi
            if test -f "$extension/content.css"; then cp "$extension/content.css" addon/; fi
            if test -f "$extension/options.html"; then cp "$extension/options.html" "$extension/options.js" addon/; fi
            npx --yes web-ext@10.8.0 lint --self-hosted --source-dir addon
            rm -rf addon
          done
  firefox:
    name: Firefox font regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps firefox
      - if: runner.os == 'Windows'
        run: npx playwright install firefox
      - run: npm run test:firefox
  live-x:
    name: Authenticated X extension (Firefox)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-firefox@v1
      - run: npm ci
      - name: Test signed-in X
        run: npm run test:live
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
