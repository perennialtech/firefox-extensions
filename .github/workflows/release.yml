name: Release

on:
  push:
    tags: ['v*', 'reddit-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Select extension and verify version
        id: extension
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            reddit-v*)
              directory=extensions/reddit-direct-images
              prefix=reddit-v
              is_reddit=true
              ;;
            v*)
              directory=extensions/x-account-location-flags
              prefix=v
              is_reddit=false
              ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REF_NAME" = "${prefix}$(node -p "require('./$directory/manifest.json').version")"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "is_reddit=$is_reddit" >> "$GITHUB_OUTPUT"
          previous=$(git tag --list "${prefix}*" --sort=-version:refname | awk -v current="$GITHUB_REF_NAME" '$0 == current {found = 1; next} found {print; exit}')
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Test both extensions
        run: npm test
      - name: Install Firefox test dependencies
        run: |
          npm ci
          npx playwright install --with-deps firefox
      - name: Verify computed chip fonts in Firefox
        run: npm run test:firefox
      - name: Prepare extension
        env:
          EXTENSION_DIRECTORY: ${{ steps.extension.outputs.directory }}
        run: |
          mkdir addon
          cp "$EXTENSION_DIRECTORY/manifest.json" "$EXTENSION_DIRECTORY/background.js" addon/
          if test -f "$EXTENSION_DIRECTORY/content.js"; then cp "$EXTENSION_DIRECTORY/content.js" addon/; fi
      - name: Lint extension
        run: npx --yes web-ext@10.8.0 lint --self-hosted --source-dir addon
      - name: Sign for self-distribution
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@10.8.0 sign --channel unlisted --source-dir addon --artifacts-dir signed
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.extension.outputs.previous }}
          IS_REDDIT: ${{ steps.extension.outputs.is_reddit }}
        run: |
          shopt -s nullglob
          packages=(signed/*.xpi)
          test "${#packages[@]}" -eq 1
          if test -n "$PREVIOUS_TAG"; then
            notes=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
          else
            notes=(--notes "Initial release of this extension.")
          fi
          if test "$IS_REDDIT" = true; then
            latest=--latest=false
          else
            latest=--latest
          fi
          gh release create "$GITHUB_REF_NAME" "${packages[0]}" \
            --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}" "$latest"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: firefox-extension-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate update manifest from the latest signed releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-updates.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy update manifest
        id: pages
        uses: actions/deploy-pages@v4
