name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify version and test
        run: |
          test "v$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"
          node --check background.js
          node --check content.js
          node --test test.js
      - name: Install Firefox test dependencies
        run: |
          npm ci
          npx playwright install --with-deps firefox
      - name: Verify computed chip fonts in Firefox
        run: npm run test:firefox
      - name: Prepare extension
        run: |
          mkdir addon
          cp manifest.json background.js content.js addon/
      - name: Lint extension
        run: npx --yes web-ext@10.8.0 lint --self-hosted --source-dir addon
      - name: Sign for self-distribution
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes web-ext@10.8.0 sign --channel unlisted --source-dir addon --artifacts-dir signed
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(signed/*.xpi)
          test "${#packages[@]}" -eq 1
          gh release create "$GITHUB_REF_NAME" "${packages[0]}" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
      - name: Generate Firefox update manifest
        run: |
          mkdir site
          node --input-type=module - <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const files = readdirSync('signed').filter(name => name.endsWith('.xpi'));
          if (files.length !== 1) throw new Error('Expected exactly one signed XPI');
          const file = files[0];
          const hash = createHash('sha256').update(readFileSync(`signed/${file}`)).digest('hex');
          const update = {
            addons: {
              [manifest.browser_specific_settings.gecko.id]: {
                updates: [{
                  version: manifest.version,
                  update_link: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}/${encodeURIComponent(file)}`,
                  update_hash: `sha256:${hash}`
                }]
              }
            }
          };
          writeFileSync('site/updates.json', JSON.stringify(update, null, 2) + '\n');
          JS
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy update manifest
        id: pages
        uses: actions/deploy-pages@v4
